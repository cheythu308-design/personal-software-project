services:
  mysql:
    image: mysql:8.4
    container_name: dms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: document_management
      MYSQL_USER: dms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-dms_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-local_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
