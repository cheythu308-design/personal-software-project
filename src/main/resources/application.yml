server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: document-management-system
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/document_management?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:dms_user}
    password: ${DB_PASSWORD:dms_local_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

dms:
  storage:
    location: ${DMS_STORAGE_LOCATION:./data/documents}
    max-file-size: ${DMS_MAX_FILE_SIZE:10485760}
