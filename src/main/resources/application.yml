server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: document-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/document_management?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:dms_user}
    password: ${DB_PASSWORD:dms_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
